name: Build and Deploy

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-deployment
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check out Still
        uses: actions/checkout@v4
        with:
          repository: logeshkannan96/still
          ref: 2d35f443f8487b8a6bff57974745c456080414aa
          path: _apps/still
          ssh-key: ${{ secrets.STILL_DEPLOY_KEY }}
          persist-credentials: false
      - name: Set up Node for Still
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - name: Build and test Still
        working-directory: _apps/still
        run: |
          npm ci
          npm test
          npm run build -- --base=/still/
      - name: Include Still in portfolio assets
        run: |
          test -f _apps/still/dist/index.html
          mkdir -p public/still
          cp -R _apps/still/dist/. public/still/
          rm -rf _apps/still
      # Preserve the portfolio's existing Node version and deployment process.
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      - uses: k9n-dev/analog-publish-gh-pages@v1.0.0
        with:
          # Required: token to access / deploy on GitHub Pages
          access-token: ${{ secrets.ACCESS_TOKEN }}
          # Optional: arguments passed to `npm ci`
          install-args: '--legacy-peer-deps'
          # Optional: arguments passed to `npm run build`
          build-args: ''
          # Optional: the directory after build process to deploy (defaults to `dist/analog/public`)
          deploy-dir: 'dist/analog/public'
          # Optional: a specific branch where the static site should be deployed (defaults to `gh-pages`)
          deploy-branch: 'gh-pages' # important: --dry-run (see option below) won't actually deploy the site!
          # Optional: prevent an actual deployment (e. g. for running in branch pipelines)
          dry-run: false
