name: Build and Deploy

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-deployment
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check out Still
        uses: actions/checkout@v4
        with:
          repository: logeshkannan96/still
          ref: d4addc410e72b1d0b1f3a45d1c698335afb0d7aa
          path: _apps/still
          ssh-key: ${{ secrets.STILL_DEPLOY_KEY }}
          persist-credentials: false
      - name: Set up Node for Still
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - name: Build and test Still
        working-directory: _apps/still
        run: |
          npm ci
          npm test
          npm run build -- --base=/projects/preview/still/
      - name: Include Still in portfolio assets
        run: |
          test -f _apps/still/dist/index.html
          mkdir -p public/projects/preview/still
          cp -R _apps/still/dist/. public/projects/preview/still/
          rm -rf _apps/still
      # Preserve the portfolio's existing build runtime.
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      - name: Build portfolio
        run: |
          npm ci --legacy-peer-deps
          npm run build
          test -f dist/analog/public/index.html
          npm run test:site
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/analog/public

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
